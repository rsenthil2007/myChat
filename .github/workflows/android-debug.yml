name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Install Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        working-directory: android
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cp app/google-services.json.example app/google-services.json
          fi
      - name: Print debug keystore fingerprints
        working-directory: android
        run: keytool -list -v -keystore ci-debug.keystore -storepass android -storetype PKCS12
      - name: Assemble debug APK
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
          set +e
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-build-cache --no-configuration-cache 2>&1 | tee gradle-assemble.log
          status=$?
          if [ "$status" -ne 0 ]; then
            excerpt=$(grep -E '^(e: |FAILURE:|\* What went wrong:|> Task .* FAILED)' gradle-assemble.log | tail -n 30)
            echo "$excerpt"
            echo "::error::${excerpt}"
            exit "$status"
          fi
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: mychat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gradle-assemble-log
          path: android/gradle-assemble.log
